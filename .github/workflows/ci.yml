name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o /tmp/anochat-server ./cmd/server
      - name: Build migration command
        run: go build -o /tmp/anochat-migrate ./cmd/migrate

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build

  containers:
    name: Containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate development Compose file
        env:
          OAUTH_JWT_SECRET: ci-only-secret
        run: docker compose config --quiet
      - name: Validate production Compose file
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
      - name: Build API image
        run: docker build .
